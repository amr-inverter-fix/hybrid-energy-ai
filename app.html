<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hybrid Energy AI Platform</title>
<meta name="description" content="Simulation-based hybrid wind-solar engineering platform: digital twin, forecasting, fault diagnosis with Shapley explanations, controller evaluation, battery health, IoT readiness, reports.">
<style>
:root{--bg:#0a1220;--bg2:#0f1b2e;--card:#122238;--line:#1f3550;--tx:#e6eef8;--mut:#8fa6c0;--cy:#22d3ee;--gr:#34d399;--am:#fbbf24;--rd:#f87171;--vi:#a78bfa}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#10304a 0,transparent 60%),var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,sans-serif}
a{color:var(--cy)}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:linear-gradient(180deg,#0c1829,#0a1220);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:15px;margin:4px 8px 12px;color:var(--cy);letter-spacing:.3px}nav h1 small{display:block;color:var(--mut);font-weight:400;font-size:11px}
nav a{display:flex;justify-content:space-between;gap:6px;padding:8px 10px;margin:2px 0;border-radius:8px;color:var(--mut);text-decoration:none;font-size:13.5px}
nav a:hover{background:#12263c;color:var(--tx)}nav a.on{background:#123049;color:var(--cy);box-shadow:inset 3px 0 0 var(--cy)}nav a span{opacity:.7;font-size:12px}
main{padding:18px 22px 60px;min-width:0}
header.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
header.top h2{margin:0;font-size:21px}header.top p{margin:2px 0 0;color:var(--mut);font-size:13px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;border:1px solid var(--line);background:#0e1d30;color:var(--mut)}
.pill.sim{color:var(--am);border-color:#6b5214}.pill.rep{color:var(--vi);border-color:#4b3a8a}.pill.live{color:var(--gr);border-color:#1e6a50}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:linear-gradient(180deg,var(--card),#0f1d31);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.card h3{margin:0 0 8px;font-size:14px;color:#cfe3f7}.k{font-size:11.5px;color:var(--mut)}.v{font-size:22px;font-weight:650}.v small{font-size:12px;color:var(--mut);font-weight:400}
.src{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:6px;margin-top:3px;background:#0c2236;color:#7fb4d8;border:1px solid #1c4262}.src.a{color:var(--am);border-color:#6b5214;background:#2a2108}.src.g{color:var(--gr);border-color:#1e6a50;background:#0b2a22}.src.n{color:var(--rd);border-color:#7a2a2a;background:#2a1010}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mut);font-weight:600;font-size:12px}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.sc{overflow-x:auto}
button,select,input,textarea{font:inherit;color:var(--tx);background:#0d1b2e;border:1px solid var(--line);border-radius:8px;padding:7px 10px}
button{cursor:pointer;background:#103250;border-color:#1d5a86}button:hover{background:#14416a}button.ghost{background:transparent}button:disabled{opacity:.45;cursor:not-allowed}
input[type=number]{width:100%}label{display:block;font-size:12px;color:var(--mut)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.note{border-left:3px solid var(--am);background:#1f1a0a;padding:8px 12px;border-radius:6px;color:#e8d9a8;font-size:13px;margin:8px 0}.note.ok{border-color:var(--gr);background:#0b241c;color:#bfeadb}.note.bad{border-color:var(--rd);background:#2a1010;color:#f7c9c9}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}svg text{font-family:inherit}
.chip{font-size:10px;padding:0 5px;border-radius:5px;margin-left:5px}.chip.given{background:#0b2a22;color:var(--gr)}.chip.assumed{background:#2a2108;color:var(--am)}.chip.no{background:#2a1010;color:var(--rd)}
.empty{color:var(--mut);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:10px}
.sev-critical{color:var(--rd)}.sev-warning{color:var(--am)}.sev-info{color:var(--cy)}
#menu{display:none}
@media(max-width:860px){#app{grid-template-columns:1fr}nav{position:fixed;z-index:20;left:0;top:0;width:250px;transform:translateX(-102%);transition:.2s}nav.open{transform:none}#menu{display:inline-block}main{padding:12px 12px 50px}.v{font-size:19px}}
@media print{nav,#menu,.noprint,header.top .row{display:none!important}#app{display:block}body{background:#fff;color:#000}.card{background:#fff;border-color:#bbb;color:#000}th,td{border-color:#ccc;color:#000}.k,.src{color:#333}}
</style></head>
<body><div id="app">
<nav id="nav"><h1>⚡ Hybrid Energy AI<small>Wind + Solar engineering platform · simulation-based</small></h1><div id="links"></div>
<div style="margin:14px 8px;font-size:11px;color:var(--mut)">All values are simulated unless a label says otherwise. Not connected to hardware.</div></nav>
<main><header class="top"><div><button id="menu" class="ghost" aria-label="menu">☰</button> <h2 id="title"></h2><p id="sub"></p></div><div class="row" id="modebar"></div><button id="lang" class="ghost" aria-label="language"></button></header><div id="page"></div></main></div>
<script src="twin_engine.js"></script><script src="controllers.js"></script><script src="iot_interface.js"></script><script src="maintenance.js"></script><script src="xai.js"></script><script src="platform_lib.js"></script><script src="scenarios.js"></script>
<script>
var S_lang='en';const $=(s,e)=>(e||document).querySelector(s),Twin=window.Twin,Plat=window.Plat;
const PAGES=[['overview','Overview','نظرة عامة'],['live','Live Monitoring','المراقبة'],['twin','Digital Twin','التوأم الرقمي'],['forecast','AI Forecasting','التوقع'],['fault','Fault Diagnosis','تشخيص الأعطال'],['xai','Explainable AI','الشرح'],['energy','Energy Management','إدارة الطاقة'],['battery','Battery Health','صحة البطارية'],['iot','IoT Devices','الأجهزة'],['assistant','Engineering Assistant','المساعد'],['reports','Reports','التقارير'],['models','Model Evaluation','تقييم النماذج'],['settings','Settings','الإعدادات']];
const S={cfg:Object.assign({},Twin.DEFAULTS,{days:3}),mode:'simulation',ctl:'rule',sup:true,cycleLife:500,idx:null,ack:{},diag:null,registry:new Plat.DeviceRegistry(),replay:null,docs:null,chat:[],fc:{H:'1'}};
try{const d=JSON.parse(localStorage.getItem('hybrid_devices')||'null');if(d){for(const k in d){S.registry.register(d[k]);}}}catch(e){}
const BE={url:localStorage.getItem('hybrid_backend_url')||'',devices:[],sel:null,live:null,rows:[],err:'',health:null,t:0};
const beKey=()=>sessionStorage.getItem('hybrid_viewer_key')||'';
async function beGet(path,ms){const c=new AbortController(),tm=setTimeout(()=>c.abort(),ms||70000);try{const r=await fetch(BE.url.replace(/\/+$/,'')+path,{headers:{'x-api-key':beKey()},signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status+(r.status===401||r.status===403?' (key rejected)':''));return await r.json()}catch(e){throw new Error(e.name==='AbortError'?'timeout (free hosts can take about 1 minute to wake)':e.message)}finally{clearTimeout(tm)}}
async function beRefresh(){BE.err='';try{if(!/^(https:\/\/|http:\/\/localhost[:\/]|http:\/\/127\.0\.0\.1[:\/])/.test(BE.url))throw new Error('backend URL must start with https:// (http is allowed only for localhost)');BE.health=await beGet('/api/v1/health');BE.devices=await beGet('/api/v1/devices');if(!BE.sel&&BE.devices.length)BE.sel=BE.devices[0].device_id||BE.devices[0].id;if(BE.sel){BE.live=await beGet('/api/v1/devices/'+encodeURIComponent(BE.sel)+'/live-status');BE.rows=Plat.rowsFromHistory(await beGet('/api/v1/devices/'+encodeURIComponent(BE.sel)+'/history?limit=300&source=device'))}else{BE.live=null;BE.rows=[]}BE.t=Date.now()}catch(e){BE.err=e.message;BE.live=null;BE.rows=[]}}
const beLive=()=>!!(BE.live&&BE.live.live_verified);
const LANG=localStorage.getItem('hybrid_lang')||'en';S_lang=LANG;
const cache={};async function J(u){if(cache[u])return cache[u];const r=await fetch(u);if(!r.ok)throw new Error(u+' HTTP '+r.status);return cache[u]=await r.json()}
const fmt=(x,d=1)=>x===null||x===undefined||!isFinite(x)?'n/a':(+x).toFixed(d);const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const src=(t,c)=>`<span class="src ${c||''}">${t}</span>`;
function policy(){const k=S.ctl;if(k==='fixed'||k==='rule')return k;const W=cache['v2/rl_weights.json'];if(!W)throw new Error('RL weights not loaded');return window.Ctl.neural(W[k])}
function run(){S.run=Twin.runTwin(S.cfg,{controller:policy(),supervisor:S.sup});S.health=Plat.batteryHealth(S.run,{cycle_life:S.cycleLife});S.alarms=Plat.alarmsFromRun(S.run,'simulation');if(S.idx===null||S.idx>=S.run.trace.t.length)S.idx=Math.min(S.run.trace.t.length-1,144+72)}
/* ---------- charts ---------- */
function chart(o){const W=720,H=o.h||210,L=46,R=10,T=10,B=26,x=o.x,n=x.length;const all=o.series.flatMap(s=>s.y).concat(o.band?o.band.lo.concat(o.band.hi):[]);let lo=o.min??Math.min(0,...all),hi=o.max??Math.max(...all,1e-9);if(hi===lo)hi=lo+1;const X=i=>L+(W-L-R)*i/Math.max(1,n-1),Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.label||'chart')}">`;for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#1f3550"/><text x="${L-6}" y="${Y(v)+4}" fill="#8fa6c0" font-size="10" text-anchor="end">${fmt(v,hi-lo<5?2:0)}</text>`}
 const tk=o.xticks||6;for(let i=0;i<=tk;i++){const j=Math.round((n-1)*i/tk);s+=`<text x="${X(j)}" y="${H-8}" fill="#8fa6c0" font-size="10" text-anchor="middle">${o.xfmt?o.xfmt(x[j]):fmt(x[j],0)}</text>`}
 if(o.band){let p='';for(let i=0;i<n;i++)p+=(i?'L':'M')+X(i)+' '+Y(o.band.hi[i]);for(let i=n-1;i>=0;i--)p+='L'+X(i)+' '+Y(o.band.lo[i]);s+=`<path d="${p}Z" fill="#22d3ee" opacity=".15"/>`}
 for(const se of o.series){let p='';se.y.forEach((v,i)=>p+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1));s+=`<path d="${p}" fill="none" stroke="${se.color}" stroke-width="1.6" ${se.dash?'stroke-dasharray="4 3"':''}/>`}
 if(o.mark!==undefined)s+=`<line x1="${X(o.mark)}" x2="${X(o.mark)}" y1="${T}" y2="${H-B}" stroke="#fbbf24" stroke-dasharray="3 3"/>`;
 s+='</svg><div class="k">'+o.series.map(se=>`<span style="color:${se.color}">━ ${esc(se.name)}</span>`).join(' &nbsp; ')+(o.band?' &nbsp; <span style="color:#22d3ee">▒ '+esc(o.band.name)+'</span>':'')+(o.unit?' &nbsp; ('+o.unit+')':'')+'</div>';return s}
function bars(items,o){o=o||{};const m=Math.max(...items.map(i=>Math.abs(i.v)),1e-12);return '<div>'+items.map(i=>`<div style="display:grid;grid-template-columns:130px 1fr 70px;gap:8px;align-items:center;margin:3px 0"><div class="k">${esc(i.n)}</div><div style="position:relative;height:14px;background:#0c1a2b;border-radius:4px"><div style="position:absolute;${i.v>=0?'left:50%':'right:50%'};width:${50*Math.abs(i.v)/m}%;height:100%;background:${i.v>=0?'#34d399':'#f87171'};border-radius:3px"></div><div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:#4a6580"></div></div><div class="k n" style="text-align:right">${i.v>=0?'+':''}${fmt(i.v,3)}</div></div>`).join('')+'</div>'}
/* ---------- helpers ---------- */
const tHM=i=>{const h=(i%144)/6;return 'D'+(Math.floor(i/144)+1)+' '+String(Math.floor(h)).padStart(2,'0')+':'+String(Math.round((h%1)*60)).padStart(2,'0')};
function modeBadge(){return S.mode==='simulation'?'<span class="pill sim">SIMULATION</span>':S.mode==='replay'?'<span class="pill rep">REPLAY (historical file)</span>':'<span class="pill live">LIVE HARDWARE</span>'}
function table(h,rows,cls){return `<div class="sc"><table><thead><tr>${h.map((x,i)=>`<th class="${cls&&cls[i]||''}">${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+r.map((c,i)=>`<td class="${cls&&cls[i]||''}">${c}</td>`).join('')+'</tr>').join('')}</tbody></table></div>`}
function dl(name,mime,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function loading(el,msg){el.innerHTML=`<div class="empty">${msg||'Loading…'}</div>`}
function fail(el,e){el.innerHTML=`<div class="note bad"><b>Could not load data.</b> ${esc(e.message||e)}<br>Check your connection and reload. Nothing is shown in place of missing data.</div>`}
/* ---------- pages ---------- */
const P={};
P.overview=async el=>{const r=S.run,t=r.trace,i=S.idx,c=r.cfg,cap=r.capacity_Wh,k=r.kpi;const gen=t.gen_dc[i],pv=t.pv[i],wd=t.wind[i],load=t.load_served[i],soc=t.soc[i],bw=t.batt_w[i];
 const crit=t.crit_un[i]>1e-9?'<span class="sev-critical">UNSERVED</span>':'<span style="color:var(--gr)">served</span>';const act=['serve all','serve + deferrable','shed non-critical'][t.act[i]];
 const card=(n,v,u,s,c2)=>`<div class="card"><div class="k">${n}</div><div class="v">${v} <small>${u}</small></div>${src(s,c2)}</div>`;
 const E='engine · simulation';
 const lossI=t.loss_boost[i]+t.loss_inv[i]+t.loss_batt[i];
 el.innerHTML=`<div class="note">Everything on this page comes from the digital-twin engine run with the configuration in <a href="#twin">Digital Twin</a>. Mode: <b>${S.mode}</b>. No real telemetry is displayed.</div>
 <div class="row noprint" style="margin:8px 0"><label style="flex:1;min-width:240px">Time step: <b>${tHM(i)}</b> (simulated clock)<input id="tsl" type="range" min="0" max="${t.t.length-1}" value="${i}"></label><span class="pill">Controller: ${S.ctl}${S.sup?' + supervisor':''}</span></div>
 <div class="grid g4">${card('Total generation',fmt(gen,0),'W DC',E)}${card('Solar (PV)',fmt(pv,0),'W',E)}${card('Wind (after boost)',fmt(wd,0),'W',E)}${card('Consumption served',fmt(load,0),'W AC',E)}
 ${card('Battery SOC',fmt(soc*100,1),'%',E)}${card('Battery current',fmt(bw/c.batt_v,1),'A (+charge)','estimated = P / nominal V','a')}${card('Battery voltage','n/a','','not modelled in the twin','n')}${card('Stored energy',fmt(soc*cap/1000,2),'kWh total (incl. reserve)',E)}
 ${card('Critical load',crit,'',E)}${card('Operating mode',act,'','controller decision · '+S.ctl)}${card('Last data update',tHM(i),'','simulated clock, not wall time','a')}${card('Renewable utilisation',fmt(k.renewable_utilization_pct,1),'% (run)',E)}</div>
 <div class="grid g2" style="margin-top:12px"><div class="card"><h3>Energy flow at ${tHM(i)} ${src(E)}</h3><div id="flow"></div></div>
 <div class="card"><h3>Power over time</h3>${chart({x:t.t.map(v=>v/6),series:[{name:'Generation',color:'#34d399',y:t.gen_dc},{name:'Load served',color:'#22d3ee',y:t.load_served}],mark:i,unit:'W',xfmt:v=>'h'+Math.round(v),label:'power'})}${src(E)}</div>
 <div class="card"><h3>Battery SOC history</h3>${chart({x:t.t.map(v=>v/6),series:[{name:'SOC %',color:'#a78bfa',y:t.soc.map(v=>v*100)}],min:0,max:100,mark:i,unit:'%',xfmt:v=>'h'+Math.round(v),label:'soc'})}${src(E)}</div>
 <div class="card"><h3>Efficiency and losses (run totals)</h3>${table(['Item','Wh'],[['Generation',fmt(k.generation_Wh,0)],['Load served',fmt(k.load_served_Wh,0)],['Boost (wind) losses',fmt(k.losses_Wh.boost,0)],['Inverter losses',fmt(k.losses_Wh.inverter,0)],['Battery losses',fmt(k.losses_Wh.battery_charge+k.losses_Wh.battery_discharge,0)],['Curtailed',fmt(k.curtailment_Wh,0)],['Stored energy change',fmt(k.stored_energy_change_Wh,0)],['Balance residual',k.balance_residual_Wh.toExponential(1)]],['','n'])}<div class="k">System efficiency (served load / generation): ${fmt(100*k.load_served_Wh/Math.max(1e-9,k.generation_Wh),1)}% ${src(E)}</div></div></div>
 <div class="card" style="margin-top:12px"><h3>Alarms and event history ${src('derived from engine run','')}</h3>${alarmTable()}</div>`;
 $('#tsl').oninput=e=>{S.idx=+e.target.value;P.overview(el)};flow($('#flow'),i)};
function alarmTable(){if(!S.alarms.length)return '<div class="empty">No alarms in this simulated run.</div>';return table(['Severity','Time (sim)','Category','Related measurements','Suggested investigation','Status'],S.alarms.slice(0,40).map(a=>[`<span class="sev-${a.severity}">${a.severity}</span>`,tHM(Math.round(a.time_h*6)),a.category,Object.entries(a.related).map(([k,v])=>k+'='+fmt(v,2)).join(', '),esc(a.investigation),S.ack[a.id]?'acknowledged':`<button class="ghost" data-ack="${a.id}">Acknowledge</button>`]))}
document.addEventListener('click',e=>{const a=e.target.closest('[data-ack]');if(a){S.ack[a.dataset.ack]=true;render()}});
function flow(el,i){const t=S.run.trace,c=S.run.cfg;const pv=t.pv[i],wd=t.wind[i],wraw=wd+t.loss_boost[i],bw=t.batt_w[i],ld=t.load_served[i],inv=t.loss_inv[i],cur=t.curt[i];const th=v=>1+Math.min(9,v/80);
 const box=(x,y,w,h,l,v,col)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="9" fill="#0d1c30" stroke="${col||'#2b4d70'}"/><text x="${x+w/2}" y="${y+h/2-3}" text-anchor="middle" fill="#cfe3f7" font-size="12">${l}</text><text x="${x+w/2}" y="${y+h/2+13}" text-anchor="middle" fill="${col||'#8fa6c0'}" font-size="11">${v}</text>`;
 const ar=(x1,y1,x2,y2,w,col)=>w>0.5?`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${th(w)}" marker-end="url(#ah)"/>`:`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#2b4d70" stroke-dasharray="3 3"/>`;
 const chg=bw>=0;el.innerHTML=`<svg viewBox="0 0 640 270" width="100%" role="img" aria-label="energy flow"><defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0L7,3L0,6Z" fill="#9fc2e0"/></marker></defs>
 ${box(10,20,110,48,'☀ PV',fmt(pv,0)+' W','#fbbf24')}${box(10,100,110,48,'Wind (terminals)',fmt(wraw,0)+' W','#22d3ee')}${box(160,100,100,48,'Boost',fmt(t.loss_boost[i],1)+' W loss','#8fa6c0')}
 ${box(300,50,100,60,'DC bus',fmt(t.gen_dc[i],0)+' W','#34d399')}${box(300,175,100,48,'Battery',(chg?'charge ':'discharge ')+fmt(Math.abs(bw),0)+' W',chg?'#a78bfa':'#f87171')}${box(450,50,90,60,'Inverter',fmt(inv,1)+' W loss','#8fa6c0')}${box(560,50,72,60,'Loads',fmt(ld,0)+' W','#22d3ee')}${box(450,175,100,48,'Grid','not configured','#4a5f78')}
 ${ar(120,44,300,70,pv,'#fbbf24')}${ar(120,124,160,124,wraw,'#22d3ee')}${ar(260,124,310,105,wd,'#22d3ee')}${chg?ar(350,110,350,175,Math.abs(bw),'#a78bfa'):ar(350,175,350,110,Math.abs(bw),'#f87171')}${ar(400,80,450,80,ld+inv,'#34d399')}${ar(540,80,560,80,ld,'#22d3ee')}
 <text x="320" y="255" fill="#8fa6c0" font-size="11">curtailed ${fmt(cur,0)} W · battery loss ${fmt(t.loss_batt[i],1)} W</text></svg>`}
P.live=async el=>{if(S.mode==='live'&&BE.url&&beKey()&&Date.now()-BE.t>15000)await beRefresh();const live=S.registry.liveAvailable()||beLive();let h=`<div class="note">${modeBadge()} Simulation, replay and live data are kept strictly separate. Live mode needs a registered device that sent at least 10 valid <code>source:"device"</code> messages and is currently online.</div>`;
