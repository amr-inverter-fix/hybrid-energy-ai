# Render blueprint (free web service). Secrets (HYBRID_ADMIN_KEY, HYBRID_VIEWER_KEY) are set in the dashboard, not here.
services:
  - type: web
    name: hybrid-energy-ai-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app_from_env --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HYBRID_DB
        value: /tmp/hybrid.db
      - key: HYBRID_ORIGINS
        value: https://amr-inverter-fix.github.io
      - key: HYBRID_ADMIN_KEY
        sync: false
      - key: HYBRID_VIEWER_KEY
        sync: false
